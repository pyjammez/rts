<body>
  <div id="titleScreen" class="title-screen">
    <h1>open rts</h1>
    <div class="title-hint">click anywhere to continue</div>
  </div>

  <div id="modePanel" class="config-panel mode-panel" style="display: none;">
    <h1>open rts</h1>
    <div id="packageBrowser" class="package-browser" aria-label="Theme selection"></div>
    <div id="modeOptions" class="mode-options"></div>
  </div>

  <div id="configPanel" class="config-panel" style="display: none;">
    <h1 id="configTitle">Field General</h1>
    <p id="configSummary" class="config-summary"></p>
    <div id="configSections"></div>
    <button id="backToModes" class="secondary-button" type="button">Back to Modes</button>
    <button id="startButton" class="start-button">Begin Campaign</button>
  </div>

  <div id="waitingRoomPanel" class="config-panel waiting-room-panel" style="display: none;">
    <h1>Ready Room</h1>
    <p id="waitingRoomSummary" class="config-summary"></p>
    <div class="waiting-room-layout">
      <section class="waiting-room-column waiting-room-team-column" aria-label="Team selection">
        <div id="waitingRoomTeams"></div>
      </section>
      <section class="waiting-room-column waiting-room-settings-column" aria-label="Match settings">
        <div class="waiting-room-section-title">Settings</div>
        <div id="waitingRoomSettings" class="waiting-room-settings"></div>
      </section>
      <div class="waiting-room-column waiting-room-chat">
        <div class="hud-title">Chat</div>
        <div id="waitingRoomChatLog" class="waiting-room-chat-log"></div>
        <div class="waiting-room-chat-row">
          <input id="waitingRoomChatInput" type="text" placeholder="Type a message..." />
          <button id="waitingRoomChatSend" class="secondary-button" type="button">Send</button>
        </div>
      </div>
    </div>
    <button id="backToSettings" class="secondary-button" type="button">Back to Settings</button>
    <button id="readyButton" class="start-button" type="button">Ready</button>
  </div>

  <div id="gameOverScreen" class="game-over-screen" style="display: none;">
    <h1 id="gameOverTitle">Game Over</h1>
    <div id="gameOverSummary" class="game-over-summary"></div>
    <div class="title-hint">click anywhere to continue</div>
  </div>

  <div id="resourceBar" class="resource-bar" style="display: none;">
    <span class="resource-team" id="resourceTeam">Red</span>
    <span>Gold <b id="resourceGold">0</b></span>
    <span>Wood <b id="resourceWood">0</b></span>
    <span>Stone <b id="resourceStone">0</b></span>
    <span>Food <b id="resourceFood">0</b></span>
  </div>

  <div id="mapBuilderToolbar" class="map-builder-toolbar" style="display: none;">
    <div class="map-builder-title">Map Builder</div>
    <div class="map-builder-tools" id="mapBuilderTools"></div>
    <button id="mapBuilderSave" class="secondary-button" type="button">Save Map</button>
    <div id="mapBuilderStatus" class="map-builder-status">Paint the map, then save it.</div>
  </div>

  <div id="hud" class="hud" style="display: none;">
    <div class="hud-panel command-bar">
      <div id="bottomEdgeScrollZone" class="bottom-edge-scroll-zone" aria-hidden="true"></div>
      <section id="selectedInfo" class="selected-info-panel">
        <div class="command-empty-state">No selection</div>
      </section>
      <section id="unitActions" class="unit-actions-panel" aria-label="Unit actions">
        <div class="command-section-title">Actions</div>
        <div class="stance-control" role="group" aria-label="Fire stance">
          <button id="attackAtWillAction" class="command-action is-active" type="button" aria-pressed="true">Attack At Will</button>
          <button id="holdFireAction" class="command-action" type="button" aria-pressed="false">Hold Fire</button>
        </div>
        <div class="inventory-actions">
          <button id="attackMoveAction" class="command-action" type="button" aria-pressed="false">Attack Move</button>
          <button id="pickUpItemAction" class="command-action" type="button">Pick Up Item</button>
          <button id="dropItemAction" class="command-action" type="button">Drop Item</button>
          <button id="cookAction" class="command-action cook-action" type="button" aria-pressed="false">Cook</button>
          <button id="upgradeCastleAction" class="command-action" type="button" aria-pressed="false">Upgrade Castle</button>
          <button id="mineGoldAction" class="command-action worker-action" type="button" aria-pressed="false">Mine Gold</button>
          <button id="mineStoneAction" class="command-action worker-action" type="button" aria-pressed="false">Mine Stone</button>
          <button id="chopWoodAction" class="command-action worker-action" type="button" aria-pressed="false">Chop Wood</button>
          <button id="gatherFoodAction" class="command-action worker-action" type="button" aria-pressed="false">Gather Food</button>
          <button id="burnHouseAction" class="command-action" type="button" aria-pressed="false">Burn House</button>
        </div>
        <div id="unitActionStatus" class="unit-action-status">Select a unit</div>
      </section>
      <section id="constructionPanel" class="construction-panel" aria-label="Building construction">
        <div class="command-section-title">Build</div>
        <div id="constructionActions" class="construction-actions">
          <div class="command-empty-state">Select a builder</div>
        </div>
      </section>
      <section class="command-map-panel" aria-label="Minimap">
        <canvas id="miniMapCanvas" width="240" height="136"></canvas>
      </section>
    </div>
  </div>

  <script>
    const canvas3d = document.getElementById('gameCanvas3d');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas3d.width = window.innerWidth;
      canvas3d.height = window.innerHeight;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
  </script>
